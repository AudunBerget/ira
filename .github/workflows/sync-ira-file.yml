name: Sync IRAComplete.xls from Google Drive

on:
  schedule:
    - cron: '0 6 10 * *'  # 6am UTC on the 10th of every month
  workflow_dispatch:        # allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-auth google-api-python-client

      - name: Write service account credentials to disk
        run: echo '${{ secrets.GDRIVE_SA_KEY }}' > sa_key.json

      - name: Fetch, validate, and sync file
        id: sync
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          TARGET_PATH: public/IRAComplete.xls
          EXPECTED_FILENAME: IRAComplete.xls
        run: python scripts/validate_and_sync.py

      - name: Clean up credentials
        if: always()
        run: rm -f sa_key.json

      - name: Commit and push if file changed
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/IRAComplete.xls
          git commit -m "Auto-sync IRAComplete.xls from Google Drive"
          git push

      - name: Notify on failure
        if: failure()
        run: |
          if [ -n "${{ secrets.NOTIFY_WEBHOOK_URL }}" ]; then
            curl -s -X POST -H "Content-Type: application/json" \
              -d '{"text":"IRAComplete.xls sync failed. Check the Actions log for details."}' \
              "${{ secrets.NOTIFY_WEBHOOK_URL }}"
          else
            echo "No NOTIFY_WEBHOOK_URL secret set, skipping notification."
          fi
